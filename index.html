<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose: #c23b55;
      --ink: #6d2436;
      --cream: #fff8f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100%;
      overflow: hidden;
      font-family: "Nunito", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 18%, #fff 0%, transparent 46%),
        radial-gradient(ellipse at 50% 120%, #f7c9d2 0%, transparent 42%),
        linear-gradient(180deg, #fff5f3 0%, #fde8ec 48%, #f8d5de 100%);
    }

    .glow {
      position: fixed;
      inset: auto 0 8vh;
      height: 28vh;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(255, 182, 193, 0.55), transparent 68%);
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 220px;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      padding: 18px 42px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      background: linear-gradient(180deg, #ef5d78 0%, #d63a58 55%, #c12d4c 100%);
      box-shadow:
        0 10px 24px rgba(194, 59, 85, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.45s ease;
      animation: pulse 1.8s ease-in-out infinite;
    }

    button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 16px 30px rgba(194, 59, 85, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    button.gone {
      animation: none;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.86);
    }

    .message {
      position: absolute;
      width: min(92vw, 760px);
      text-align: center;
      font-family: "Great Vibes", "Segoe Script", cursive;
      font-size: clamp(3.2rem, 9vw, 6.4rem);
      font-weight: 400;
      line-height: 1.05;
      color: #9d2340;
      text-shadow: 0 8px 24px rgba(157, 35, 64, 0.12);
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      pointer-events: none;
    }

    .message.show {
      animation: arrive 1.15s 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--c, #e11d48);
      transform: translate(-50%, -50%) rotate(45deg);
      opacity: 0;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      background: inherit;
      border-radius: 50%;
    }

    .heart::before { top: -8px; left: 0; }
    .heart::after { left: -8px; top: 0; }

    .heart.burst {
      animation: burst 1.7s ease-out forwards;
    }

    .heart.float {
      animation: float-up var(--dur, 6s) linear forwards;
    }

    .balloon {
      position: absolute;
      bottom: -140px;
      width: 58px;
      height: 74px;
      left: var(--x, 50%);
      animation: rise var(--dur, 8s) cubic-bezier(0.25, 0.1, 0.2, 1) forwards;
      animation-delay: var(--delay, 0s);
      filter: drop-shadow(0 10px 8px rgba(140, 30, 50, 0.12));
    }

    .balloon .body {
      width: 100%;
      height: 100%;
      border-radius: 50% 50% 46% 46% / 42% 42% 58% 58%;
      background: var(--c);
      position: relative;
      box-shadow: inset -8px -10px 0 rgba(90, 10, 24, 0.18);
    }

    .balloon .body::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 24px;
      left: 12px;
      top: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: rotate(18deg);
    }

    .balloon .body::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 10px;
      height: 8px;
      background: #7a1830;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      transform: translateX(-50%);
    }

    .balloon .string {
      position: absolute;
      top: calc(100% + 4px);
      left: 50%;
      width: 1.5px;
      height: 72px;
      background: rgba(90, 30, 40, 0.35);
      transform-origin: top center;
      animation: sway 2.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    @keyframes arrive {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes burst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(45deg) scale(0.2);
      }
      18% { opacity: 1; }
      100% {
        opacity: 0;
        transform:
          translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
          rotate(calc(45deg + var(--spin)))
          scale(var(--s, 1));
      }
    }

    @keyframes float-up {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px) rotate(45deg) scale(var(--s, 1));
      }
      12% { opacity: 1; }
      100% {
        opacity: 0;
        transform:
          translate(calc(-50% + var(--drift)), -110vh)
          rotate(calc(45deg + var(--spin)))
          scale(var(--s, 1));
      }
    }

    @keyframes rise {
      0% { transform: translateY(0) translateX(0) scale(var(--scale, 1)); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-130vh) translateX(var(--sway)) scale(var(--scale, 1)); opacity: 1; }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(7deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      button { animation: none; }
      .message.show { animation: none; opacity: 1; transform: none; }
      .heart, .balloon { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="sky" id="sky" aria-hidden="true"></div>
  <main>
    <div class="stage">
      <button id="gift" type="button">Click me</button>
      <p class="message" id="message" aria-hidden="true">I love you endlessly</p>
    </div>
  </main>
  <script>
    const button = document.getElementById("gift");
    const message = document.getElementById("message");
    const sky = document.getElementById("sky");
    const reds = ["#e11d48", "#be123c", "#f43f5e", "#9f1239", "#ff4d6d", "#c9184a", "#fb7185"];
    let opened = false;

    function heart(className) {
      const el = document.createElement("span");
      el.className = "heart " + className;
      el.style.setProperty("--c", reds[Math.floor(Math.random() * reds.length)]);
      el.style.setProperty("--s", (0.55 + Math.random() * 1.15).toFixed(2));
      el.style.setProperty("--spin", (Math.random() * 80 - 40).toFixed(0) + "deg");
      el.addEventListener("animationend", () => el.remove());
      return el;
    }

    function burst(count) {
      const rect = button.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      for (let i = 0; i < count; i++) {
        const el = heart("burst");
        const angle = Math.random() * Math.PI * 2;
        const dist = 90 + Math.random() * 320;
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        el.style.setProperty("--dy", (Math.sin(angle) * dist - 30) + "px");
        el.style.animationDelay = (Math.random() * 0.18) + "s";
        sky.appendChild(el);
      }
    }

    function floatHearts(count) {
      for (let i = 0; i < count; i++) {
        const el = heart("float");
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = (78 + Math.random() * 24) + "vh";
        el.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
        el.style.setProperty("--dur", (9 + Math.random() * 6) + "s");
        el.style.animationDelay = (Math.random() * 2.2) + "s";
        sky.appendChild(el);
      }
    }

    function balloons(count) {
      for (let i = 0; i < count; i++) {
        const wrap = document.createElement("div");
        wrap.className = "balloon";
        wrap.style.setProperty("--c", reds[i % reds.length]);
        wrap.style.setProperty("--x", (4 + Math.random() * 90) + "vw");
        wrap.style.setProperty("--sway", (Math.random() * 70 - 35) + "px");
        wrap.style.setProperty("--dur", (16 + Math.random() * 8) + "s");
        wrap.style.setProperty("--delay", (Math.random() * 1.6) + "s");
        wrap.style.setProperty("--scale", (0.72 + Math.random() * 0.5).toFixed(2));
        wrap.innerHTML = '<div class="body"></div><div class="string"></div>';
        wrap.addEventListener("animationend", (event) => {
          if (event.animationName === "rise" && event.target === wrap) wrap.remove();
        });
        sky.appendChild(wrap);
      }
    }

    button.addEventListener("click", () => {
      if (opened) return;
      opened = true;
      button.classList.add("gone");
      button.setAttribute("aria-hidden", "true");
      message.classList.add("show");
      message.setAttribute("aria-hidden", "false");
      burst(42);
      balloons(14);
      floatHearts(22);
      window.setInterval(() => {
        balloons(3);
        floatHearts(7);
      }, 2200);
    });
  </script>
</body>
</html>
